<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — Pending Vehicle Approval</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-container { max-width: 1000px; margin: 40px auto; padding: 16px; }
    .listing { border: 1px solid #e6e6e6; padding: 12px; margin-bottom: 12px; border-radius: 6px; display:flex; justify-content:space-between; align-items:center }
    .listing-info { max-width: 75%; }
    .listing-actions button { margin-left: 8px }
    .status-badge { padding: 4px 8px; border-radius: 4px; font-weight:600 }
  </style>
</head>
<body>
  <div class="admin-container">
    <h1>Admin Panel — Pending Vehicle Approval</h1>

    <div style="margin:12px 0">
      <label>Admin Token (for demonstration): </label>
      <input id="admin-token" style="width:260px" value="secret-admin-token">
      <label style="margin-left:12px">Admin Name: </label>
      <input id="admin-name" style="width:160px" value="Admin A">
      <button id="reload-btn" class="btn btn-outline">Refresh</button>
    </div>

    <div id="listings"></div>
    <p id="empty" style="display:none">No pending vehicles for approval</p>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
